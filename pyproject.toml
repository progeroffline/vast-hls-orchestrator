[project]
name = "vast-hls-orchestrator"
version = "0.1.0"
description = "Rent a temporary Vast.ai GPU instance, transcode a source video to ABR HLS, and publish the result back to the origin server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "rich>=13,<15",
  "loguru>=0.7,<1",
]

[project.scripts]
vast-hls-orchestrator = "vast_hls_orchestrator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vast_hls_orchestrator"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.6",
]
